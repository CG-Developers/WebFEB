<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="root-path" content="">
    <meta name="description" content="Galería de fotos y vídeos — Flamenco & Events Barcelona.">
    <title>Galería — Flamenco & Events Barcelona</title>
    <link rel="icon" href="assets/logo.jpg">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Lightbox */
        .lb { display:none; position:fixed; inset:0; z-index:999; background:rgba(10,10,10,.96); align-items:center; justify-content:center; }
        .lb.open { display:flex; }
        .lb img { max-width:90vw; max-height:90vh; object-fit:contain; }
        .lb-close { position:absolute; top:24px; right:28px; color:#F3EDE0; font-size:2rem; cursor:pointer; line-height:1; }
        .lb-prev, .lb-next { position:absolute; top:50%; transform:translateY(-50%); color:#F3EDE0; font-size:2rem; cursor:pointer; padding:16px; opacity:.7; }
        .lb-prev { left:16px; } .lb-next { right:16px; }
        .lb-prev:hover, .lb-next:hover { opacity:1; }
        /* Vídeos integrats sota el carrusel */
        .gal-videos {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            max-width: 720px; margin: 4px auto 0;
        }
        .video-card {
            position: relative; aspect-ratio: 9/16;
            background: #111; border-radius: 4px; overflow: hidden; cursor: pointer;
        }
        .video-card > img { width:100%; height:100%; object-fit:contain; display:block; background:#0a0a0a; transition: filter .4s ease; }
        .video-card:hover > img { filter: brightness(.9); }
        .video-card video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none; border-radius:4px; background:#000; }
        .gal-play {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            transition: transform .25s ease; pointer-events:none;
        }
        .video-card:hover .gal-play { transform: translate(-50%,-50%) scale(1.12); }
        .video-card:hover .gal-play svg circle { stroke: rgba(255,255,255,.95); }
        @media (max-width: 720px) { .gal-videos { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <!-- Hero mini -->
    <section class="hero hero-inner" style="min-height:40vh">
        <div class="hero-bg"></div>
        <div class="hero-overlay" style="background:rgba(10,10,10,.7)"></div>
        <div class="hero-pattern"></div>
        <div class="hero-body" style="padding-bottom:48px">
            <div class="breadcrumb"><a href="index.html">Inicio</a><span>›</span>Galería</div>
            <div class="hero-eyebrow">Fotos &amp; Vídeos</div>
            <h1 class="hero-title" style="font-size:clamp(2.5rem,6vw,4.5rem)">Galería</h1>
        </div>
    </section>

    <!-- Fotos -->
    <section class="section section--white">
        <div class="section-inner">
            <div class="section-label">Fotografía</div>
            <h2 class="section-title" style="margin-bottom:28px">Momentos en escena</h2>
            <div data-ring-root>
                <div class="ring" id="gallery" role="group" aria-label="Galería de fotos — arrastra para girar">
                    <button class="ring-card" type="button" data-idx="0" aria-label="Baile">
                        <img src="assets/photos/galeria-15.jpg" alt="Bailaora con bata de cola" loading="eager" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="1" aria-label="Abanico">
                        <img src="assets/photos/galeria-13.jpg" alt="Bailaora flamenca con abanico" loading="eager" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="2" aria-label="El cuadro">
                        <img src="assets/photos/galeria-19.jpg" alt="Cuadro flamenco completo en escena" loading="eager" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="3" aria-label="Tablao">
                        <img src="assets/photos/tablao-show-1.jpg" alt="Tablao flamenco en directo en Barcelona" loading="eager" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="4" aria-label="Palmas">
                        <img src="assets/photos/galeria-17.jpg" alt="Artistas flamencos con palmas" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="5" aria-label="En escena">
                        <img src="assets/photos/eventos/rocio-byn.jpg" alt="Bailaora flamenca en escena" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="6" aria-label="Braceo">
                        <img src="assets/photos/eventos/rocio-color.jpg" alt="Bailaora flamenca con mantoncillo" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="7" aria-label="Abanico en blanco y negro">
                        <img src="assets/photos/galeria-20.jpg" alt="Bailaora flamenca con abanico" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="8" aria-label="Claveles">
                        <img src="assets/photos/galeria-16.jpg" alt="Escenario del tablao con claveles rojos" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="9" aria-label="Cante">
                        <img src="assets/photos/eventos/cantaora.jpg" alt="Cantaora flamenca" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="10" aria-label="Compás">
                        <img src="assets/photos/galeria-14.jpg" alt="Bailaora y guitarrista" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="11" aria-label="Guitarra">
                        <img src="assets/photos/eventos/cante_y_guitarra.jpg" alt="Cante y guitarra flamenca" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="12" aria-label="Mantón">
                        <img src="assets/photos/galeria-18.jpg" alt="Bailaora con mantón" loading="lazy" decoding="async" draggable="false">
                    </button>
                    <button class="ring-card" type="button" data-idx="13" aria-label="Toque">
                        <img src="assets/photos/eventos/nito.jpg" alt="Guitarrista flamenco" loading="lazy" decoding="async" draggable="false">
                    </button>
                </div>
                <div class="ring-nav">
                    <button class="tiles-btn" type="button" data-ring-prev aria-label="Anterior">&#8592;</button>
                    <span class="ring-hint">Arrastra o pulsa una foto · <span class="ring-count" data-ring-count>1 / 14</span></span>
                    <button class="tiles-btn" type="button" data-ring-next aria-label="Siguiente">&#8594;</button>
                </div>
            </div>

            <!-- Vídeos, integrats just sota el carrusel -->
            <div class="gal-videos">
                <div class="video-card" onclick="playGalVideo(this)">
                    <img src="assets/photos/eventos/poster-manton.jpg" alt="Mantón flamenco — Ver vídeo">
                    <div class="gal-play">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="31" stroke="rgba(255,255,255,.6)" stroke-width="2"/><polygon points="26,20 26,44 46,32" fill="rgba(255,255,255,.9)"/></svg>
                    </div>
                    <video playsinline preload="none" controlsList="nodownload" oncontextmenu="return false">
                        <source src="assets/videos/gal-manton.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="video-card" onclick="playGalVideo(this)">
                    <img src="assets/photos/eventos/poster-castanuelas.jpg" alt="Castañuelas flamencas — Ver vídeo">
                    <div class="gal-play">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="31" stroke="rgba(255,255,255,.6)" stroke-width="2"/><polygon points="26,20 26,44 46,32" fill="rgba(255,255,255,.9)"/></svg>
                    </div>
                    <video playsinline preload="none" controlsList="nodownload" oncontextmenu="return false">
                        <source src="assets/videos/gal-castanuelas.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </div>
    </section>

    <!-- Lightbox -->
    <div class="lb" id="lb">
        <span class="lb-close" id="lb-close">×</span>
        <span class="lb-prev" id="lb-prev">‹</span>
        <img id="lb-img" src="" alt="">
        <span class="lb-next" id="lb-next">›</span>
    </div>

    <div id="footer-placeholder"></div>
    <style>
        .video-card:hover .gal-play { transform: translate(-50%,-50%) scale(1.1) !important; }
        .video-card:hover .gal-play svg circle { stroke: rgba(255,255,255,.9); }
    </style>
    <script>
    function playGalVideo(card) {
        var img = card.querySelector('img');
        var play = card.querySelector('.gal-play');
        var video = card.querySelector('video');
        if (img) img.style.display = 'none';
        if (play) play.style.display = 'none';
        video.style.display = 'block';
        video.controls = true;
        video.play();
    }
    </script>
    <script src="js/main.js"></script>
    <script>
    // Lightbox
    const items = document.querySelectorAll('.ring-card');
    const lb = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    const srcs = [...items].map(i => i.querySelector('img')?.src || '');
    let current = 0;
    window.openLightbox = function (i) {
        current = i;
        lbImg.src = srcs[current];
        lb.classList.add('open');
    };
    const step = d => { current = (current + d + srcs.length) % srcs.length; lbImg.src = srcs[current]; };
    document.getElementById('lb-close').onclick = () => lb.classList.remove('open');
    document.getElementById('lb-prev').onclick = () => step(-1);
    document.getElementById('lb-next').onclick = () => step(1);
    lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
    document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') lb.classList.remove('open');
        if (e.key === 'ArrowLeft') step(-1);
        if (e.key === 'ArrowRight') step(1);
    });
    </script>
</body>
</html>
