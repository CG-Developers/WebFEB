<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="root-path" content="">
    <meta name="description" content="Galería de fotos y vídeos — Flamenco & Events Barcelona.">
    <title>Galería — Flamenco & Events Barcelona</title>
    <link rel="icon" href="assets/logo.jpg">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .gallery-masonry { columns: 3; gap: 4px; }
        .gallery-masonry .gitem { break-inside: avoid; margin-bottom: 4px; }
        .gitem { overflow: hidden; cursor: pointer; position: relative; }
        .gitem img { width: 100%; display: block; transition: transform 500ms cubic-bezier(.16,1,.3,1); }
        .gitem:hover img { transform: scale(1.04); }
        @media(max-width:768px) { .gallery-masonry { columns:2; } }
        @media(max-width:480px) { .gallery-masonry { columns:1; } }
        /* Lightbox */
        .lb { display:none; position:fixed; inset:0; z-index:999; background:rgba(10,10,10,.96); align-items:center; justify-content:center; }
        .lb.open { display:flex; }
        .lb img { max-width:90vw; max-height:90vh; object-fit:contain; }
        .lb-close { position:absolute; top:24px; right:28px; color:#F3EDE0; font-size:2rem; cursor:pointer; line-height:1; }
        .lb-prev, .lb-next { position:absolute; top:50%; transform:translateY(-50%); color:#F3EDE0; font-size:2rem; cursor:pointer; padding:16px; opacity:.7; }
        .lb-prev { left:16px; } .lb-next { right:16px; }
        .lb-prev:hover, .lb-next:hover { opacity:1; }
        /* Videos */
        .video-card video { width:100%; height:100%; object-fit:contain; display:block; border-radius:4px; }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <!-- Hero mini -->
    <section class="hero hero-inner" style="min-height:40vh">
        <div class="hero-bg"></div>
        <div class="hero-overlay" style="background:rgba(10,10,10,.7)"></div>
        <div class="hero-pattern"></div>
        <div class="hero-body" style="padding-bottom:48px">
            <div class="breadcrumb"><a href="index.html">Inicio</a><span>›</span>Galería</div>
            <div class="hero-eyebrow">Fotos &amp; Vídeos</div>
            <h1 class="hero-title" style="font-size:clamp(2.5rem,6vw,4.5rem)">Galería</h1>
        </div>
    </section>

    <!-- Fotos -->
    <section class="section section--white">
        <div class="section-inner">
            <div class="section-label">Fotografía</div>
            <h2 class="section-title" style="margin-bottom:28px">Momentos en escena</h2>
            <div class="ring3d" id="gallery" aria-label="Galería de fotos — arrastra para girar">
                <div class="ring3d-track">
                    <figure class="ring-card gitem" data-idx="0">
                        <img src="assets/photos/galeria-15.jpg" alt="Bailaora con bata de cola" loading="eager" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Baile</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="1">
                        <img src="assets/photos/galeria-13.jpg" alt="Bailaora flamenca con abanico" loading="eager" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Abanico</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="2">
                        <img src="assets/photos/galeria-19.jpg" alt="Cuadro flamenco completo en escena" loading="eager" decoding="async" draggable="false">
                        <figcaption class="ring-cap">El cuadro</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="3">
                        <img src="assets/photos/tablao-show-1.jpg" alt="Tablao flamenco en directo en Barcelona" loading="eager" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Tablao</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="4">
                        <img src="assets/photos/galeria-17.jpg" alt="Artistas flamencos con palmas" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Palmas</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="5">
                        <img src="assets/photos/eventos/rocio.jpg" alt="Bailaora en escena" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">En escena</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="6">
                        <img src="assets/photos/galeria-16.jpg" alt="Escenario del tablao con claveles rojos" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Claveles</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="7">
                        <img src="assets/photos/eventos/cantaora.jpg" alt="Cantaora flamenca" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Cante</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="8">
                        <img src="assets/photos/galeria-14.jpg" alt="Bailaora y guitarrista" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Compás</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="9">
                        <img src="assets/photos/eventos/cante_y_guitarra.jpg" alt="Cante y guitarra flamenca" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Guitarra</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="10">
                        <img src="assets/photos/galeria-18.jpg" alt="Bailaora con mantón" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Mantón</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="11">
                        <img src="assets/photos/tablao-show-2.jpg" alt="Espectáculo flamenco íntimo" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Zapateado</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="12">
                        <img src="assets/photos/eventos/nito.jpg" alt="Guitarrista flamenco" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Toque</figcaption>
                    </figure>
                    <figure class="ring-card gitem" data-idx="13">
                        <img src="assets/photos/tablao-show-3.jpg" alt="Artistas del tablao de Barcelona" loading="lazy" decoding="async" draggable="false">
                        <figcaption class="ring-cap">Fin de fiesta</figcaption>
                    </figure>
                </div>
            </div>
            <div class="ring3d-nav">
                <button class="tiles-btn" type="button" data-ring-prev aria-label="Anterior">&#8592;</button>
                <span class="ring3d-hint">Arrastra o pulsa una foto</span>
                <button class="tiles-btn" type="button" data-ring-next aria-label="Siguiente">&#8594;</button>
            </div>
        </div>
    </section>

    <!-- Lightbox -->
    <div class="lb" id="lb">
        <span class="lb-close" id="lb-close">×</span>
        <span class="lb-prev" id="lb-prev">‹</span>
        <img id="lb-img" src="" alt="">
        <span class="lb-next" id="lb-next">›</span>
    </div>

    <!-- Vídeos -->
    <section class="section section--dark">
        <div class="section-inner">
            <div class="section-label">Vídeos</div>
            <h2 class="section-title">En vídeo</h2>
            <p class="section-subtitle">Fragmentos de nuestros espectáculos</p>
            <div class="grid-2" style="gap:24px;margin-top:0">
                <div class="video-card" style="aspect-ratio:16/9;background:#111;border-radius:4px;overflow:hidden;position:relative;cursor:pointer" onclick="playGalVideo(this)">
                    <img src="assets/photos/eventos/poster-video1.jpg" alt="Flamenco en directo — Ver vídeo" style="width:100%;height:100%;object-fit:cover;display:block">
                    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transition:transform .25s ease" class="gal-play">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="31" stroke="rgba(255,255,255,.6)" stroke-width="2"/><polygon points="26,20 26,44 46,32" fill="rgba(255,255,255,.9)"/></svg>
                    </div>
                    <video style="display:none;width:100%;height:100%;object-fit:contain;border-radius:4px" playsinline preload="none" controlsList="nodownload" oncontextmenu="return false">
                        <source src="assets/videos/video_1284.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="video-card" style="aspect-ratio:16/9;background:#111;border-radius:4px;overflow:hidden;position:relative;cursor:pointer" onclick="playGalVideo(this)">
                    <img src="assets/photos/eventos/poster-video2.jpg" alt="Espectáculo flamenco — Ver vídeo" style="width:100%;height:100%;object-fit:cover;display:block">
                    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transition:transform .25s ease" class="gal-play">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="31" stroke="rgba(255,255,255,.6)" stroke-width="2"/><polygon points="26,20 26,44 46,32" fill="rgba(255,255,255,.9)"/></svg>
                    </div>
                    <video style="display:none;width:100%;height:100%;object-fit:contain;border-radius:4px" playsinline preload="none" controlsList="nodownload" oncontextmenu="return false">
                        <source src="assets/videos/video_1295.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <style>
        .video-card:hover .gal-play { transform: translate(-50%,-50%) scale(1.1) !important; }
        .video-card:hover .gal-play svg circle { stroke: rgba(255,255,255,.9); }
    </style>
    <script>
    function playGalVideo(card) {
        var img = card.querySelector('img');
        var play = card.querySelector('.gal-play');
        var video = card.querySelector('video');
        if (img) img.style.display = 'none';
        if (play) play.style.display = 'none';
        video.style.display = 'block';
        video.controls = true;
        video.play();
    }
    </script>
    <script src="js/main.js"></script>
    <script>
    // Simple lightbox
    const items = document.querySelectorAll('.gitem');
    const lb = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    let current = 0;
    const srcs = [...items].map(i => i.querySelector('img')?.src || '');
    items.forEach(item => {
        item.addEventListener('click', () => {
            current = parseInt(item.dataset.idx);
            lbImg.src = srcs[current];
            lb.classList.add('open');
        });
    });
    document.getElementById('lb-close').onclick = () => lb.classList.remove('open');
    document.getElementById('lb-prev').onclick = () => { current = (current - 1 + srcs.length) % srcs.length; lbImg.src = srcs[current]; };
    document.getElementById('lb-next').onclick = () => { current = (current + 1) % srcs.length; lbImg.src = srcs[current]; };
    lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
    document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') lb.classList.remove('open');
        if (e.key === 'ArrowLeft') { current = (current-1+srcs.length)%srcs.length; lbImg.src=srcs[current]; }
        if (e.key === 'ArrowRight') { current = (current+1)%srcs.length; lbImg.src=srcs[current]; }
    });
    </script>
</body>
</html>
